[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elitebet-ingestion"
version = "0.1.0"
description = "Readable, defensive sports odds ingestion for Elitebet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<4",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
]

[project.scripts]
elitebet-ingest = "elitebet_ingestion.cli:main"
elitebet-export-csv = "elitebet_ingestion.csv_export:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elitebet_ingestion"]

[tool.pytest.ini_options]
addopts = "-ra --cov=elitebet_ingestion --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
